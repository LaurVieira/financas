<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Minhas Finanças</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#efede7; --text:#1d2420; --muted:#6a736d;
  --line:#e2dfd6; --accent:#1f7a5a; --accent-ink:#ffffff; --accent-soft:#dff0e8;
  --warn:#b4531c; --warn-soft:#f8e6d9; --bad:#b3261e; --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.05);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --surface:#1b211e; --surface2:#242b27; --text:#e8ece9; --muted:#99a39d;
    --line:#2d3631; --accent:#4cc79a; --accent-ink:#06261a; --accent-soft:#1d3a2e;
    --warn:#f0a070; --warn-soft:#3a2a1f; --bad:#ff8a80; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1b211e; --surface2:#242b27; --text:#e8ece9; --muted:#99a39d;
  --line:#2d3631; --accent:#4cc79a; --accent-ink:#06261a; --accent-soft:#1d3a2e;
  --warn:#f0a070; --warn-soft:#3a2a1f; --bad:#ff8a80; --shadow:none; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.app{max-width:760px;margin:0 auto;padding:0 16px 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
header h1{font-size:20px;margin:0;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--accent)} .dot.sav{background:#d9a406} .dot.off{background:var(--warn)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:6px 4px;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent);background:var(--accent-soft);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);min-width:0}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;margin-top:2px;letter-spacing:-.01em;overflow-wrap:anywhere}
.stat.big{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:transparent}
.stat.big .l{color:inherit;opacity:.85} .stat.big .v{font-size:30px}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn>i{background:var(--warn)}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{min-width:0;flex:1} .row .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .t span{font-size:13px;color:var(--muted)}
.row .amt{font-weight:700;white-space:nowrap}
button.ed{background:none;border:0;color:var(--muted);padding:6px;cursor:pointer;border-radius:8px}
button.ed svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--warn-soft);color:var(--bad)}
.btn.block{width:100%}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 12px}
.toolbar h2{margin:0;font-size:18px}
.catrow{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.catrow .bar{margin:0}
.inv{border-top:1px solid var(--line);padding:14px 0}
.inv:first-of-type{border-top:0}
.inv .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.inv .kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px;font-size:14px}
.inv .kv div span{display:block;font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:99px;font-weight:600}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:26px 8px}
dialog{border:0;border-radius:18px;padding:0;width:min(440px,calc(100vw - 24px));background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
form.f{padding:18px 18px 0;display:grid;gap:12px}
form.f h3{margin:0 0 2px;font-size:18px}
label.fl{display:grid;gap:5px;font-size:13px;color:var(--muted)}
label.fl input,label.fl select{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
label.fl input:focus,label.fl select:focus{outline:2px solid var(--accent);outline-offset:0}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;flex-wrap:wrap}
form.f .actions{position:sticky;bottom:0;background:var(--surface);padding:10px 0 18px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.4}
.note{font-size:12.5px;color:var(--muted);padding:4px 2px 0}
.next{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.next:first-of-type{border-top:0}
.pill{font-size:12px;background:var(--surface2);padding:2px 8px;border-radius:99px;color:var(--muted)}
.mesnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 14px}
.mesnav b{font-size:16px;flex:1;text-align:center}
.mesbtn:disabled{opacity:.3;cursor:default}
.mesbtn{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;width:40px;height:40px;font-size:20px;line-height:1;cursor:pointer}
.chk{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:99px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chk.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.row.off{opacity:.55}
.pill.soon{background:var(--warn-soft);color:var(--warn);font-weight:600}
@media (min-width:640px){.stat .v{font-size:22px}}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
#auth.on{display:flex}
#auth .box{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);display:grid;gap:12px}
#auth h2{margin:0;font-size:22px}
#auth .msg{font-size:13.5px;color:var(--warn);min-height:18px}
#auth .msg.ok{color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Minhas Finanças</h1>
    <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">Carregando…</span></div>
  </header>
  <main id="view"></main>
</div>

<nav><div class="in" id="nav"></div></nav>
<dialog id="dlg"></dialog>
<div id="auth"><form class="box" id="authForm">
  <h2>Minhas Finanças</h2>
  <div class="hint">Entre na sua conta.</div>
  <label class="fl">E-mail<input type="email" id="aEmail" autocomplete="username" required></label>
  <label class="fl">Senha<input type="password" id="aPass" autocomplete="current-password" minlength="6" required></label>
  <div class="msg" id="aMsg"></div>
  <button class="btn block" type="submit">Entrar</button>
  <button class="btn ghost block" type="button" id="aSignup">Criar conta</button>
</form></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>
"use strict";
var VERSAO = "v11";
var CATS = ["Moradia","Contas","Transporte","Alimentação","Saúde","Educação","Assinaturas","Dívidas","Outros"];
var DEFAULT = { v:1, renda:{ salario:0, dia:5, extras:[] }, gastos:[], invest:[], cdi:13.65, inicioApp:"" };
var state = clone(DEFAULT);
var tab = "resumo";
var store = { doc:null, uid:null, timer:null, saving:false, dirty:false, pendingRemote:null };

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(){ return (crypto && crypto.randomUUID) ? crypto.randomUUID().slice(0,12) : String(Date.now())+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
var BRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
function money(n){ return BRL.format(isFinite(n)?n:0); }
function num(s){ s=String(s==null?"":s).trim().replace(/\s/g,"").replace(/^R\$/,""); if(s.indexOf(",")>-1) s=s.replace(/\./g,"").replace(",","."); var n=parseFloat(s); return isFinite(n)?n:0; }
function fmtNum(n){ return String(n==null?"":n).replace(".",","); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayDiff(a,b){ var x=a.split("-").map(Number), y=b.split("-").map(Number); return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/86400000); }
function fmtDM(iso){ if(!iso) return "—"; var p=iso.split("-"); return p[2]+"/"+p[1]; }
function addDiasISO(iso,n){ var p=iso.split("-").map(Number); var d=new Date(p[0],p[1]-1,p[2]+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso){ if(!iso) return "—"; var p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }

function extraInfo(e){
  if(!e.mes0) return { ativo:true };
  var p=e.mes0.split("-").map(Number), idx=(view.y-p[0])*12+(view.m-p[1])+1;
  if(idx<1) return { ativo:false };
  if(e.tipo==="periodo"){
    var q=(e.mes1||e.mes0).split("-").map(Number);
    return { ativo:(view.y-q[0])*12+(view.m-q[1])<=0 };
  }
  if(e.tipo!=="salario" && idx>1) return { ativo:false };
  return { ativo:true };
}
function extrasAtivas(){ return state.renda.extras.filter(function(e){ return extraInfo(e).ativo; }); }
function salarioDe(){
  var key = view.y+"-"+String(view.m).padStart(2,"0"), r = null;
  (state.renda.hist||[]).forEach(function(e){ if(e.mes<=key && (!r || e.mes>=r.mes)) r = e; });
  return r || { mes:"", salario:0, dia:5 };
}
function rendaTotal(){ return salarioDe().salario + extrasAtivas().reduce(function(s,e){return s+e.valor;},0); }
var view = (function(){ var d=new Date(); return { y:d.getFullYear(), m:d.getMonth()+1 }; })();
function ymNow(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function ymIni(){ var t=(state.inicioApp||ymNow()).split("-").map(Number); return t[0]*12+t[1]; }
function podeVoltar(){ return view.y*12+view.m > ymIni(); }
function ymKey(){ return view.y+"-"+String(view.m).padStart(2,"0"); }
function mesAtual(){ var d=new Date(); return view.y===d.getFullYear() && view.m===d.getMonth()+1; }
function mesLabel(){ var t=new Date(view.y,view.m-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); return t.charAt(0).toUpperCase()+t.slice(1); }
function shiftMes(n){ if(n<0 && !podeVoltar()) return; var d=new Date(view.y,view.m-1+n,1); view={ y:d.getFullYear(), m:d.getMonth()+1 }; render(); }
function monthNav(){
  return '<div class="mesnav"><button class="mesbtn" data-act="mesPrev" aria-label="Mês anterior"'+(podeVoltar()?'':' disabled')+'>‹</button>'
    + '<b>'+mesLabel()+'</b>'
    + (mesAtual() ? '' : '<button class="chk" data-act="mesHoje">Hoje</button>')
    + '<button class="mesbtn" data-act="mesNext" aria-label="Próximo mês">›</button></div>';
}
function diasAte(g){
  var last = new Date(view.y, view.m, 0).getDate();
  var alvo = new Date(view.y, view.m-1, Math.min(g.dia,last));
  var h = new Date(); h = new Date(h.getFullYear(), h.getMonth(), h.getDate());
  return Math.round((alvo-h)/86400000);
}
function fmtMes(iso){ if(!iso) return "—"; var p=iso.split("-"); return p[1]+"/"+p[0]; }
function mesBase(g){
  if(g.mes0) return g.mes0;
  if(g.parc==="sim" && g.inicio) return g.inicio.slice(0,7);
  return null;
}
function gastoInfo(g){
  var r={ ativo:true, atual:0, total:0, estado:"ativo" };
  var base=mesBase(g);
  if(!base) return r;
  var p=base.split("-").map(Number);
  var idx=(view.y-p[0])*12+(view.m-p[1])+1;
  if(g.parc==="sim" && g.total>0){
    r.atual=idx; r.total=g.total;
    if(idx<1){ r.ativo=false; r.estado="futuro"; }
    else if(idx>g.total){ r.ativo=false; r.estado="quitado"; }
  } else {
    if(idx<1){ r.ativo=false; r.estado="futuro"; }
    else if(g.rep!=="sim" && idx>1){ r.ativo=false; r.estado="encerrado"; }
  }
  return r;
}
function gastosAtivos(){ return state.gastos.filter(function(g){ return gastoInfo(g).ativo; }); }
function isPago(g){ return !!(g.pagos && g.pagos[ymKey()]); }
function gastosTotal(){ return gastosAtivos().reduce(function(s,g){return s+g.valor;},0); }
function gastosPagos(){ return gastosAtivos().filter(isPago).reduce(function(s,g){return s+g.valor;},0); }
function aliquotaIR(dias){ return dias<=180?0.225 : dias<=360?0.20 : dias<=720?0.175 : 0.15; }
function calcDate(){
  if(mesAtual()) return todayISO();
  var last = new Date(view.y, view.m, 0).getDate();
  return view.y+"-"+String(view.m).padStart(2,"0")+"-"+String(last).padStart(2,"0");
}
function calcInv(i){
  var ate = calcDate();
  var r = { ativo:false, dias:0, anual:0, bruto:0, ganho:0, ir:0, liquido:0, aliq:0 };
  if(!i.data || i.data > ate) return r;
  var fim = (i.venc && i.venc < ate) ? i.venc : ate;
  var dias = Math.max(0, dayDiff(i.data, fim));
  var anual = i.tipo==="cdi" ? (state.cdi/100)*(i.taxa/100) : (i.taxa/100);
  var bruto = i.valor*Math.pow(1+anual, dias/365);
  var ganho = bruto - i.valor, aliq = aliquotaIR(dias), ir = ganho*aliq;
  return { ativo:true, dias:dias, anual:anual, bruto:bruto, ganho:ganho, ir:ir, liquido:bruto-ir, aliq:aliq };
}
function investTotais(){
  var t = { aplicado:0, bruto:0, liquido:0, ganho:0 };
  state.invest.forEach(function(i){
    var c = calcInv(i); if(!c.ativo) return;
    t.aplicado += i.valor; t.bruto += c.bruto; t.liquido += c.liquido; t.ganho += c.liquido - i.valor;
  });
  return t;
}
var LS = "fin:v2";
var sb = null, session = null;
var store = { timer:null, saving:false, dirty:false, pendingRemote:null };

function setSync(kind, txt){
  document.getElementById("dot").className = "dot "+kind;
  document.getElementById("syncTxt").textContent = txt;
}
function localSave(){ try{ localStorage.setItem(LS, JSON.stringify({ state:state, dirty:store.dirty })); }catch(e){} }
function localLoad(){ try{ return JSON.parse(localStorage.getItem(LS)); }catch(e){ return null; } }
function normalize(s){
  var d = clone(DEFAULT);
  if(!s || typeof s!=="object") return d;
  d.renda.salario = +((s.renda||{}).salario)||0;
  d.renda.dia = +((s.renda||{}).dia)||5;
  d.renda.extras = Array.isArray((s.renda||{}).extras)? s.renda.extras : [];
  d.gastos = Array.isArray(s.gastos)? s.gastos : [];
  d.invest = Array.isArray(s.invest)? s.invest : [];
  d.cdi = +s.cdi || d.cdi;
  d.inicioApp = s.inicioApp || ((d.gastos.length || d.invest.length || d.renda.salario) ? "2026-10" : ymNow());
  d.gastos.forEach(function(g){ if(!mesBase(g)){ g.mes0 = d.inicioApp; g.rep = "nao"; } });
  d.renda.extras.forEach(function(e){ if(!e.mes0){ e.mes0 = d.inicioApp; e.tipo = "outras"; } });
  var hs = Array.isArray((s.renda||{}).hist) ? s.renda.hist.filter(function(e){ return e && e.mes && isFinite(+e.salario); }) : [];
  if(!hs.length && d.renda.salario>0) hs = [{ mes:d.inicioApp, salario:d.renda.salario, dia:d.renda.dia }];
  d.renda.hist = hs.sort(function(a,b){ return a.mes<b.mes ? -1 : a.mes>b.mes ? 1 : 0; });
  return d;
}
function persist(){
  store.dirty = true; localSave(); render();
  if(!sb || !session){ setSync("off","Só neste aparelho"); return; }
  setSync("sav","Salvando…");
  clearTimeout(store.timer);
  store.timer = setTimeout(flush, 500);
}
async function flush(){
  if(store.saving || !store.dirty || !sb || !session) return;
  store.saving = true; store.dirty = false;
  var failed = false;
  try{
    var r = await sb.from("financas").upsert({ user_id:session.user.id, data:state, updated_at:new Date().toISOString() });
    if(r.error) throw r.error;
  }catch(e){ failed = true; store.dirty = true; setSync("off","Sem conexão"); }
  localSave();
  store.saving = false;
  if(!failed){ if(store.dirty) flush(); else setSync("ok","Sincronizado"); }
}
function dialogOpen(){ return document.getElementById("dlg").open; }
function applyRemote(s){
  var next = normalize(s);
  if(JSON.stringify(next)===JSON.stringify(state)) return;
  state = next; localSave(); render();
}
async function pull(){
  if(!sb || !session || store.saving) return;
  if(store.dirty){ flush(); return; }
  try{
    var r = await sb.from("financas").select("data").eq("user_id", session.user.id).maybeSingle();
    if(r.error) throw r.error;
    if(r.data && r.data.data){
      if(dialogOpen()) store.pendingRemote = r.data.data; else applyRemote(r.data.data);
      setSync("ok","Sincronizado");
    } else { store.dirty = true; flush(); }
  }catch(e){ setSync("off","Offline"); }
}

function authMsg(t, ok){ var m=document.getElementById("aMsg"); m.textContent=t||""; m.className="msg"+(ok?" ok":""); }
function updateAuthUI(){ document.getElementById("auth").classList.toggle("on", !session); }
async function doAuth(signup){
  if(!sb){ authMsg("Preencha o config.js."); return; }
  var email=document.getElementById("aEmail").value.trim(), pass=document.getElementById("aPass").value;
  if(!email || pass.length<6){ authMsg("Digite e-mail e senha (mínimo 6)."); return; }
  authMsg("Aguarde…", true);
  try{
    var r = signup ? await sb.auth.signUp({email:email,password:pass}) : await sb.auth.signInWithPassword({email:email,password:pass});

function openForm(opt){
  var dlg = document.getElementById("dlg");
  var html = '<form class="f" method="dialog" id="ff"><h3>'+esc(opt.title)+'</h3>';
  opt.fields.forEach(function(f){
    var v = opt.values[f.k]; if(v==null) v="";
    html += '<label class="fl"'+(f.dep?' data-dk="'+f.dep.k+'" data-dv="'+f.dep.v+'"':'')+'>'+esc(f.label);
    if(f.type==="select"){
      html += '<select name="'+f.k+'">'+f.options.map(function(o){ var ov=o.v!==undefined?o.v:o, ol=o.l!==undefined?o.l:o; return '<option value="'+esc(ov)+'"'+(String(ov)===String(v)?" selected":"")+'>'+esc(ol)+'</option>'; }).join("")+'</select>';
    } else if(f.type==="date"){
      html += '<input type="date" name="'+f.k+'" value="'+esc(v)+'">';
    } else {
      html += '<input type="text" name="'+f.k+'" value="'+esc(f.type==="money"||f.type==="dec"||f.type==="int"?(v===0&&f.blank0?"":fmtNum(v)):v)+'" inputmode="'+(f.type==="int"?"numeric":(f.type==="money"||f.type==="dec")?"decimal":"text")+'" autocomplete="off"'+(f.ph?' placeholder="'+esc(f.ph)+'"':"")+'>';
    }
    if(f.hint) html += '<span class="hint">'+esc(f.hint)+'</span>';
    html += '</label>';
  });
  html += '<div class="actions">';
  if(opt.onDelete) html += '<button type="button" class="btn danger" id="fdel">Excluir</button>';
  html += '<button type="button" class="btn ghost" id="fcan">Cancelar</button><button type="submit" class="btn">Salvar</button></div></form>';
  dlg.innerHTML = html;
  var form = dlg.querySelector("form");
  function applyDeps(){ form.querySelectorAll("[data-dk]").forEach(function(l){ l.style.display = form.elements[l.dataset.dk].value===l.dataset.dv ? "" : "none"; }); }
  form.addEventListener("change", applyDeps); applyDeps();
  function close(){ dlg.close(); }
  dlg.querySelector("#fcan").onclick = close;
  if(opt.onDelete) dlg.querySelector("#fdel").onclick = function(){ if(confirm("Excluir este item?")){ opt.onDelete(); close(); } };
  form.onsubmit = function(ev){
    ev.preventDefault();
    var out = {};
    opt.fields.forEach(function(f){
      var raw = form.elements[f.k].value;
      out[f.k] = (f.type==="money"||f.type==="dec") ? num(raw) : f.type==="int" ? Math.round(num(raw)) : String(raw).trim();
    });
    if(opt.validate){ var msg = opt.validate(out); if(msg){ alert(msg); return; } }
    opt.onSave(out); close();
  };
  dlg.onclose = function(){
    if(store.pendingRemote){ var p=store.pendingRemote; store.pendingRemote=null; applyRemote(p); }
  };
  dlg.showModal();
}

function editSalario(){

  openForm({ title:"Salário a partir de "+mesLabel(), values:{ salario:atual.salario, dia:atual.dia },
    fields:[ {k:"salario",label:"Salário (R$)",type:"money",blank0:true,ph:"0,00"}, {k:"dia",label:"Dia do pagamento",type:"int"} ],
    validate:function(o){ if(o.dia<1||o.dia>31) return "Informe um dia entre 1 e 31."; },
    onSave:function(o){
      var key = ymKey(), h = state.renda.hist = state.renda.hist || [];
      var ex = h.find(function(e){ return e.mes===key; });
      if(ex){ ex.salario=o.salario; ex.dia=o.dia; } else { h.push({ mes:key, salario:o.salario, dia:o.dia }); }
      h.sort(function(a,b){ return a.mes<b.mes ? -1 : a.mes>b.mes ? 1 : 0; });

function editExtra(id){
  var it = state.renda.extras.find(function(e){return e.id===id;}) || {nome:"",valor:0,tipo:"outras"};
  function pad(n){ return String(n).padStart(2,"0"); }
  var base = it.data;
  if(!base){
    var ym = (id && it.mes0) || (view.y+"-"+pad(view.m));
    var last = new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate();
    base = ym+"-"+pad(Math.min(new Date().getDate(), last));
  }
  var ini = it.ini || base;
  var fim = it.fim || addDiasISO(ini, 6);
  var vals = Object.assign({}, it, { data:base, ini:ini, fim:fim, tipo: it.tipo==="periodo" ? "periodo" : "outras" });
  openForm({ title:id?"Editar renda":"Nova renda", values:vals,
    fields:[ {k:"nome",label:"Nome",type:"text",ph:"Ex.: Freelance"},
             {k:"valor",label:"Valor (R$)",type:"money",blank0:true},
             {k:"tipo",label:"Categoria",type:"select",options:[{v:"outras",l:"Outras"},{v:"periodo",l:"Por período"}]},
             {k:"data",label:"Data",type:"date",dep:{k:"tipo",v:"outras"}},
             {k:"ini",label:"De",type:"date",dep:{k:"tipo",v:"periodo"}},
             {k:"fim",label:"Até",type:"date",dep:{k:"tipo",v:"periodo"}} ],
    validate:function(o){
      if(!o.nome) return "Digite o nome.";
      if(!(o.valor>0)) return "Digite o valor.";
      if(o.tipo==="periodo"){
        if(!o.ini || !o.fim) return "Escolha as datas.";
        if(o.fim < o.ini) return "A data final vem antes da inicial.";
      } else if(!o.data) return "Escolha a data.";
    },
    onSave:function(o){
      if(o.tipo==="periodo"){ o.data=o.ini; o.mes0=o.ini.slice(0,7); o.mes1=o.fim.slice(0,7); }
      else { o.mes0=o.data.slice(0,7); o.ini=""; o.fim=""; o.mes1=""; }
      if(id){ Object.assign(it,o); } else { o.id=uid(); state.renda.extras.push(o); }
      persist();
    },
    onDelete:id?function(){ state.renda.extras=state.renda.extras.filter(function(e){return e.id!==id;}); persist(); }:null });
}
function editGasto(id){
  var it = state.gastos.find(function(g){return g.id===id;}) || {nome:"",valor:0,cat:"Moradia",dia:5,forma:"outro",parc:"nao",rep:"nao",total:0,inicio:""};

  }
  var vals = Object.assign({}, it, { venc:venc });

      + '</div></div>';
  }).join("") : '<div class="empty">Nenhum CDB cadastrado.</div>';
  h += '</div><div class="note">Valores estimados até hoje (ou até o fim do mês escolhido), com IR regressivo. O valor oficial é o do seu banco.</div>';
  return h;
}

function render(){
  renderNav();
  var v = document.getElementById("view");
  v.innerHTML = tab==="resumo"?vResumo() : tab==="renda"?vRenda() : tab==="gastos"?vGastos() : vInvest();
}

document.addEventListener("click", function(ev){
  var b = ev.target.closest("[data-tab],[data-act]"); if(!b) return;
  if(b.dataset.tab){ tab=b.dataset.tab; render(); window.scrollTo(0,0); return; }
  var id = b.dataset.id;
  switch(b.dataset.act){
    case "salario": editSalario(); break;
    case "addExtra": editExtra(null); break;
    case "editExtra": editExtra(id); break;
    case "addGasto": editGasto(null); break;
    case "editGasto": editGasto(id); break;
    case "togglePago": togglePago(id); break;
    case "mesPrev": shiftMes(-1); break;
    case "mesNext": shiftMes(1); break;
    case "mesHoje": var hj=new Date(); view={ y:hj.getFullYear(), m:hj.getMonth()+1 }; render(); break;
    case "addInv": editInvest(null); break;
    case "editInv": editInvest(id); break;
    case "delInv": if(confirm("Excluir este CDB?")){ state.invest=state.invest.filter(function(x){return x.id!==id;}); persist(); } break;
    case "cdi": editCDI(); break;
    case "export": exportar(); break;
    case "logout": logout(); break;
  }
});

async function boot(){
  var loc = localLoad();
  if(loc && loc.state){ state = normalize(loc.state); store.dirty = !!loc.dirty; }
  render();
  var cfg = window.APP_CONFIG || {};
  var ok = window.supabase && cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && cfg.SUPABASE_URL.indexOf("http")===0;
  if(!ok){ setSync("off","Falta configurar"); document.getElementById("auth").classList.add("on"); authMsg(window.supabase ? "Preencha o config.js." : "Sem internet."); return; }
  sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });
  sb.auth.onAuthStateChange(function(ev, s){ var had=!!session; session=s; updateAuthUI(); if(s && !had) pull(); });
  var r = await sb.auth.getSession(); session = r.data.session; updateAuthUI();
  if(session){ setSync("sav","Conectando…"); pull(); } else setSync("off","Entre na sua conta");
}
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible") pull(); });
window.addEventListener("online", function(){ pull(); });
window.addEventListener("beforeunload", localSave);
if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
setSync("sav","Carregando…");
boot();
</script>
</body>
</html>
